schema_version: 1
id: statechart-unification
title: "Unify coraplex's Plan tree with cramph's Statechart"
description: >
  Retire coraplex's eager, perform()-based Plan tree in favour of cramph's
  reactive, tick-based Statechart as the single persistent structure for
  describing and running behaviour. The lever is ActionDescription: it stops
  being a Designator that builds PlanNode subtrees and becomes a CompositeNode
  that expands into statechart nodes directly. Every item here is a pull
  request into 'plan-cramp-second-iter' on the Tigul fork, which itself goes on
  to the 'cramph' branch of ichumuh/cognitive_robot_abstract_machine once the
  work below has collected there. Nothing here targets cram2/main.
default_repository: Tigul/cognitive_robot_abstract_machine

waves:
  - id: foundation
    name: "Foundation"
    description: >
      The unlanded cramph package every other item stacks on.
  - id: conversion
    name: "Action conversion"
    description: >
      ActionDescription becomes a CompositeNode, and Statechart grows the Plan
      introspection that actually transfers. Two independent tracks.
  - id: retirement
    name: "Retiring the plan layer"
    description: >
      Remove the duplicate control-flow vocabulary and the throwaway
      per-batch motion state chart.
  - id: deferred
    name: "Deferred work"
    description: >
      Imperative actions and the final removal of the Plan classes, set aside
      until the patterns above are established.

tracks:
  - id: cramph-base
    name: "cramph foundation"
    wave: foundation
  - id: statechart-introspection
    name: "Statechart introspection"
    wave: conversion
    description: "Pure cramph work, parallel to the action conversion."
  - id: action-conversion
    name: "Action conversion"
    wave: conversion
    description: "coraplex-side work making actions into composite nodes."
  - id: plan-layer-retirement
    name: "Plan layer retirement"
    wave: retirement
  - id: deferred-work
    name: "Deferred work"
    wave: deferred

items:
  - id: cramph-foundation
    title: "Land the collected cramph work onto ichumuh:cramph"
    branch: plan-cramp-second-iter
    repository: ichumuh/cognitive_robot_abstract_machine
    pull_request_number: null
    track: cramph-base
    depends_on: []
    status: in_progress
    notes: >
      The cramph package lives on the 'cramph' branch of
      ichumuh/cognitive_robot_abstract_machine (fetched locally as
      simon/cramph), which is the shared integration base and is 42 commits
      ahead of cram2/main. plan-cramp-second-iter is 7 commits on top of it
      and 0 behind: graph navigation, start/end times, life-cycle callbacks,
      the candidate generator move, and typing fixes - work already pulling
      Statechart toward Plan parity, which is this plan's own direction. Those
      7 commits touch cramph/statechart.py, node.py, context.py,
      data_types.py and coraplex/plans/{plan_node,executables,underspecified}.py,
      so later items branch off this rather than off the base to avoid
      conflicting with it. No pull request opened for them yet.
      Separately, the base itself is currently broken: the 'Rip
      MotionDesignator' commit (3cb9824eb, an ancestor of simon/cramph, landed
      out-of-band while its PR ichumuh#7 shows closed) removed MoveMotion,
      ClosingMotion, MoveGripperMotion and LookingMotion while
      alternative_motion_mappings/{tiago,stretch,hsrb}_motion_mapping.py still
      import them - verified ImportError. Inherited from the base, not caused
      by these 7 commits, but it affects anything importing those modules.
    blockers:
      - "No pull request opened yet into ichumuh:cramph. It collects every item of this plan first, so it grows as they merge into it."
      - "Base branch has broken imports in alternative_motion_mappings (inherited from the Rip MotionDesignator commit)."

  - id: statechart-plan-parity
    title: "Give Statechart the Plan introspection that transfers (layers, visualize)"
    branch: null
    pull_request_number: null
    track: statechart-introspection
    depends_on: [cramph-foundation]
    status: not_started
    notes: >
      Statechart already has nodes, top_level_nodes, get_nodes_by_type, draw()
      and history. Missing versus Plan: layers, and an interactive visualize()
      using the krrood.rustworkx_utils.visualization backends Plan already
      uses. layers must BFS over StatechartNode.children, NOT rx.layers on
      rx_graph - rx_graph's edges are transition-condition dependencies, not
      parent/child structure, so visualize() needs its own presentation graph
      the way StatechartGraphviz already builds one. simplify(), merge_nodes(),
      re_perform() and replay() deliberately do not port: they assume a
      mutable, restartable single-shot tree, which a compiled statechart is
      not. Pure cramph, no coraplex coupling.

  - id: action-description-composite-node
    title: "Action becomes a CompositeNode; convert MoveTorso, ParkArms, SetGripper"
    branch: action-description-composite-node
    pull_request_number: 4
    track: action-conversion
    depends_on: [cramph-foundation]
    status: done
    notes: >
      Open as a draft pull request into plan-cramp-second-iter, which keeps the
      diff to this work rather than the 49 commits under it. Landed as a new
      class 'Action' beside an untouched ActionDescription rather than
      changing that base, because ~25 action classes inherit it and the ones
      reached through an underspecified statement or overriding execute()
      cannot convert yet. Action subclasses CompositeNode and owns one
      internal Sequence; it must not subclass Sequence, per the dataclass
      field-ordering constraint in roadmap.md. Also split
      DesignatorParameters out of Designator, added PlanContextExtension, and
      added the ActionCompositeNode bridge so unconverted plan trees keep
      working. Condition wiring was dropped from this item, see
      wire-action-conditions. 826 tests pass across test_plan, test_actions,
      test_designator and cramph_test.

  - id: convert-remaining-declarative-actions
    title: "Convert every action whose body is a fixed composition of goals"
    branch: convert-navigate-action
    pull_request_number: 6
    track: action-conversion
    depends_on: [action-description-composite-node]
    status: done
    notes: >
      Landed in two batches. Tigul#5 (merged) converted OpenAction, CloseAction,
      DetectAction, GraspingAction, LookAtAction, MoveManipulatorAction and
      FollowToolCenterPointPathAction; Open and Close run a GraspingAction, so
      those three went together. Tigul#6 (merged 2026-09-25) converted DrivesBase with
      NavigateAction and PathPlanningNavigateAction, the first actions reached
      through an underspecified a(...) statement, and so also reworks
      UnderspecifiedNode and ActionTrial: resolution now asks make_node for the
      node that runs a proposal, and a trial rebinds the action's parameters and
      builds a fresh action rather than rebinding the action itself. Two reasons,
      both found by running the code - rebind_world_entities recurses forever on
      a statechart node, whose transition conditions point back at it, and a
      statechart node belongs to one statechart, so a tried instance cannot be
      the one that runs for real. Tigul#6 also drops keep_joint_states, which
      nothing read: three further actions carried their own copy only to forward
      it. Still blocked and each a later item's work: ElevatorNavigation needs a
      statechart node that re-parents a body (nothing in giskardpy does, and
      ReAttachNode is deliberately a plan-tree execution boundary); ReachAction
      and the FullBodyControlled tool actions override execute(); PickUpAction,
      PlaceAction and MoveToReach are reached through a(...) and PlaceAction also
      looks a previous PickUpAction up by designator type. 866 tests pass.

  - id: wire-action-conditions
    title: "Make an action's pre- and post-conditions actually gate it"
    branch: wire-action-conditions
    pull_request_number: null
    track: action-conversion
    depends_on: [action-description-composite-node]
    status: blocked
    notes: >
      Attempted and parked on a local, unpushed branch (commit "Parked: let an
      action's conditions gate it"). The wiring itself works and is covered by
      three tests: a pre-condition that does not hold stops the action before it
      acts, a post-condition that does not hold fails it, and either ends the
      statechart with ConditionNotSatisfied. One design point worth keeping: the
      action's own observation has to wait on the post-condition monitor's
      observation, or the action succeeds before the background evaluation has
      answered - acting is not arriving. What is unfinished is switching it on.
      Twelve tests fail, and not because the conditions are wrong:
      NavigateAction's evaluate True in 0.02s in a simple world, but in the
      multi-robot apartment its pre-condition monitor stays running and the body
      never starts, and underspecified resolution returns EmptyUnderspecified
      because ConditionNotSatisfied is a PlanFailure, so ActionTrial now rejects
      every candidate - which is the trial's documented purpose finally taking
      effect, all at once. Also worth knowing before resuming:
      Context.evaluate_conditions defaults to True today and gates nothing, so
      the flag currently lies; making it meaningful is part of this item.
    blockers:
      - "Turning conditions on fails 12 tests that need per-case investigation, not a shared fix."

  - id: retire-language-nodes
    title: "Retire coraplex.language's LanguageNode family for cramph.composites"
    branch: null
    pull_request_number: null
    track: plan-layer-retirement
    depends_on: [convert-remaining-declarative-actions]
    status: not_started
    notes: >
      Every LanguageNode subclass already declares its exact cramph equivalent
      through motion_state_chart_template - SequentialNode/Sequence,
      ParallelNode/Parallel, TryInOrderNode/TryInOrder, RepeatNode/RepeatUntil,
      CancelMonitor/CancelledWhenTrue, PauseMonitor/PausedWhileTrue,
      PauseUntilMonitor/PausedUntilTrue - and add_to_motion_state_chart already
      builds the real thing. Only the imperative notify() path is redundant.

  - id: persistent-motion-state-chart
    title: "Build one long-lived Statechart instead of one per execution-boundary batch"
    branch: null
    pull_request_number: null
    track: plan-layer-retirement
    depends_on: [retire-language-nodes]
    status: not_started
    notes: >
      Retires the throwaway chart in
      BuildsMotionStateChart.create_giskard_executable and the repeated
      executor.compile in GiskardExecutable._execute_simulation.
      ExecutionBoundaryNode and contains_execution_boundary need rethinking for
      a chart that no longer restarts. Biggest remaining structural change;
      expect it to split further once the earlier items reveal the real
      boundary logic.

  - id: convert-imperative-actions
    title: "Convert underspecified resolution and execute()-override actions to declarative constructs"
    branch: null
    pull_request_number: null
    track: deferred-work
    depends_on: [persistent-motion-state-chart]
    status: deferred
    notes: >
      UnderspecifiedNode and ActionTrial retry candidates in a Python loop
      catching PlanFailure; ReachAction and FullBodyControlledAction override
      execute() to call .perform() immediately with side effects. Neither maps
      onto wiring a symbolic condition once before compile, so they need
      RepeatUntil/TryInOrder/Attempt/monitor equivalents. Deferred by explicit
      decision at plan creation, not blocked.

  - id: retire-plan-layer
    title: "Retire Plan, PlanNode, Designator, PlanEntity, Executable and their ORM mappings"
    branch: null
    pull_request_number: null
    track: deferred-work
    depends_on: [convert-imperative-actions]
    status: deferred
    notes: >
      The end state: Statechart as the single persistent structure for both
      authoring and execution. Includes the ORM mappings tied to the retired
      classes.
